apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: v0-podinfo
spec:
  exclusionList:
  - ^.*\.sig$
  - ^sha256-.+$
  image: ghcr.io/stefanprodan/charts/podinfo
  interval: 12h
  provider: generic
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: v0-podinfo
spec:
  interval: 12h
  provider: generic
  ref:
    semver: 6.17.0
  timeout: 60s
  url: oci://ghcr.io/stefanprodan/charts/podinfo
---
apiVersion: chrysopoeia.helmetica.io/v1
kind: ClaimDefinition
metadata:
  name: v0.podinfo
spec:
  crdNames:
    kind: PodInfo
    plural: podinfos
  reference:
    apiVersion: source.toolkit.fluxcd.io/v1
    kind: OCIRepository
    name: v0-podinfo
  versionDiscovery:
    reference:
      apiVersion: image.toolkit.fluxcd.io/v1
      kind: ImageRepository
      name: v0-podinfo

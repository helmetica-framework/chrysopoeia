'#objmap1':
  description: |
    Item keys are always strings in JSON, we don't need to specify the type of the keys in the schema.

    If the object has `properties` it is created as a regular structured object.
    If the object has `items` it is created as a map of objects with the specified properties.

    JSON Schema: properties->properties, items->additionalProperties
  items:
    '#a':
      type: string
objmap1:
  a:
    b: c

'#objmap2':
  items:
    '#a':
      type: string
objmap2: {}

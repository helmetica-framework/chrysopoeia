apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scalarobjarrays.v3.juiceshop.helmetica-bundles.io
spec:
  group: v3.juiceshop.helmetica-bundles.io
  names:
    categories:
    - all
    - claim
    - helmetica
    kind: ScalarObjArray
    listKind: ScalarObjArrayList
    plural: scalarobjarrays
    singular: scalarobjarray
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.instanceNamespace
      name: Instance Namespace
      type: string
    - jsonPath: .status.releaseStatus
      name: Status
      type: string
    - jsonPath: .status.driftDetected
      name: Drift
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: bundle
    schema:
      openAPIV3Schema:
        properties:
          spec:
            description: Configures the desired state of the service.
            properties:
              approval:
                default:
                  strategy: Automatic
                description: Approval contains the approval strategy for the service.
                properties:
                  strategy:
                    default: Automatic
                    description: The approval strategy for the service. Can be either
                      'Automatic' or 'Manual'.
                    enum:
                    - Automatic
                    - Manual
                    type: string
                type: object
              backup:
                default:
                  enabled: false
                description: Backup configures whether and how the service's data
                  is backed up.
                properties:
                  bucketAccessClassName:
                    description: The COSI BucketAccessClass the bucket credentials
                      are minted from. Defaults to the backup controller's bucket
                      access class.
                    type: string
                  bucketClassName:
                    description: The object storage the backups are written to, as
                      the name of a COSI BucketClass. Defaults to the backup controller's
                      bucket class.
                    type: string
                  checkSchedule:
                    description: The schedule the backup repository is checked on,
                      as a cron expression or one of k8up's shortcuts. Defaults to
                      the backup controller's schedule.
                    type: string
                  enabled:
                    default: false
                    description: Whether the service's data is backed up.
                    type: boolean
                  mode:
                    default: Schedule
                    description: Who takes the backups. `Schedule` backs up the service's
                      persistent volumes on a schedule. `BucketOnly` provisions the
                      bucket and its credentials and leaves the backing up to the
                      service itself, for services whose operator writes backups to
                      object storage on its own; the bucket, its endpoint and the
                      name of the credentials secret are published in `.status.backup`.
                    enum:
                    - Schedule
                    - BucketOnly
                    type: string
                  pruneSchedule:
                    description: The schedule old backups are pruned on, as a cron
                      expression or one of k8up's shortcuts. Defaults to the backup
                      controller's schedule.
                    type: string
                  retention:
                    description: How many backups are kept. If none of these are set,
                      the backup controller's default retention applies.
                    properties:
                      keepDaily:
                        description: The number of daily backups to keep.
                        minimum: 0
                        type: integer
                      keepHourly:
                        description: The number of hourly backups to keep.
                        minimum: 0
                        type: integer
                      keepLast:
                        description: The number of most recent backups to keep.
                        minimum: 0
                        type: integer
                      keepMonthly:
                        description: The number of monthly backups to keep.
                        minimum: 0
                        type: integer
                      keepWeekly:
                        description: The number of weekly backups to keep.
                        minimum: 0
                        type: integer
                      keepYearly:
                        description: The number of yearly backups to keep.
                        minimum: 0
                        type: integer
                    type: object
                  schedule:
                    description: The schedule the backups run on, as a cron expression
                      or one of k8up's shortcuts such as `@daily-random`. Defaults
                      to the backup controller's schedule.
                    type: string
                type: object
              manages:
                description: The dependency group whose CRDs the operator of this
                  service manages.
                items:
                  properties:
                    dependencyGroup:
                      properties:
                        as:
                          description: Overrides the name the scope label is built
                            from, so that a second deployment of the same operator
                            can serve a separate set of consumers.
                          type: string
                        name:
                          description: The name of the DependencyGroup.
                          type: string
                      required:
                      - name
                      type: object
                  required:
                  - dependencyGroup
                  type: object
                type: array
              ociUrl:
                description: The OCI repository where the service bundle is stored.
                type: string
              provides:
                description: The list of dependency groups whose CRDs this service
                  ships.
                items:
                  properties:
                    dependencyGroup:
                      properties:
                        as:
                          description: Overrides the name the scope label is built
                            from, so that a second deployment of the same operator
                            can serve a separate set of consumers.
                          type: string
                        name:
                          description: The name of the DependencyGroup.
                          type: string
                      required:
                      - name
                      type: object
                  required:
                  - dependencyGroup
                  type: object
                type: array
              requires:
                description: The list of dependency groups that this service consumes.
                items:
                  properties:
                    dependencyGroup:
                      properties:
                        as:
                          description: Overrides the name the scope label is built
                            from, so that a second deployment of the same operator
                            can serve a separate set of consumers.
                          type: string
                        name:
                          description: The name of the DependencyGroup.
                          type: string
                      required:
                      - name
                      type: object
                  required:
                  - dependencyGroup
                  type: object
                type: array
              values:
                description: This field together with the `.spec.version` field defines
                  the configuration of the service. Every change to either of these
                  two fields creates a new revision of the service.
                properties:
                  arrayWithObjects1:
                    items:
                      properties:
                        name:
                          type: string
                        value:
                          type: integer
                      type: object
                    type: array
                  arrayWithObjects2:
                    items:
                      properties:
                        name:
                          type: string
                        value:
                          type: integer
                      type: object
                    type: array
                  arrayWithObjects3:
                    items:
                      properties:
                        name:
                          description: The name of the object in the array.
                          type: string
                        value:
                          type: integer
                      type: object
                    type: array
                  intmap1:
                    additionalProperties:
                      type: integer
                    type: object
                  intmap2:
                    additionalProperties:
                      type: integer
                    type: object
                  ints1:
                    items:
                      type: integer
                    type: array
                  ints2:
                    items:
                      type: integer
                    type: array
                  objmap1:
                    additionalProperties:
                      properties:
                        a:
                          type: string
                      type: object
                    description: |
                      Item keys are always strings in JSON, we don't need to specify the type of the keys in the schema.

                      If the object has `properties` it is created as a regular structured object.
                      If the object has `items` it is created as a map of objects with the specified properties.

                      JSON Schema: properties->properties, items->additionalProperties
                    type: object
                  objmap2:
                    additionalProperties:
                      properties:
                        a:
                          type: string
                      type: object
                    type: object
                  stringmap1:
                    additionalProperties:
                      type: string
                    type: object
                  stringmap2:
                    additionalProperties:
                      type: string
                    type: object
                  tags1:
                    items:
                      type: string
                    type: array
                  tags2:
                    items:
                      type: string
                    type: array
                type: object
              version:
                description: The version of the service. Every change to this field
                  together with the `.spec.values` field creates a new revision of
                  the service.
                type: string
            type: object
          status:
            description: Status contains the observed state of the service.
            properties:
              appliedRevision:
                description: The name of the revision that is currently applied to
                  the cluster.
                type: string
              backup:
                description: The observed state of the service's backups.
                properties:
                  bucket:
                    description: The bucket the backups are written to.
                    type: string
                  credentialsSecret:
                    description: The secret in the service's namespace holding the
                      bucket credentials. A service that backs itself up reads its
                      S3 access key from here.
                    type: string
                  endpoint:
                    description: The object storage endpoint the bucket lives behind.
                    type: string
                  message:
                    description: A human-readable description of the backup state.
                    type: string
                  mode:
                    description: Who takes the backups, as resolved from `.spec.backup.mode`.
                    type: string
                  ready:
                    description: Whether the service is currently being backed up.
                    type: boolean
                  schedule:
                    description: The schedule the backups run on.
                    type: string
                type: object
              driftDetected:
                description: Whether a drift was detected.
                type: boolean
              instanceNamespace:
                description: The namespace where the service is deployed in.
                type: string
              latestRevision:
                description: The name of the revision that currently matches the spec.
                type: string
              releaseStatus:
                description: The current status of the service.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: null
  storedVersions: null

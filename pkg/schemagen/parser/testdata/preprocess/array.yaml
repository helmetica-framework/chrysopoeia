# Volumes blabla learn kubernetes
'#volumes':
  items:
    '#name': {type: string}
    # Name names the volume and must be unique within the pod.
    # This is used to mount the volume into containers.
    name:
    # Type does not really exists just for testing
    type: Secret
volumes: []

# Secrets blabla learn kubernetes
secrets:
- # Name names the secret and must be unique within the pod.
  name: tls-secret

tags: [testing]

'#otherTags':
  items:
    '#':
      type: string
otherTags: []
